<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var ALLOWED = { light: true, dark: true, system: true };

        function readCookie(name) {
          var parts = document.cookie ? document.cookie.split(';') : [];
          for (var i = 0; i < parts.length; i++) {
            var part = parts[i].trim();
            if (part.indexOf(name + '=') === 0) {
              return decodeURIComponent(part.slice(name.length + 1));
            }
          }
          return null;
        }

        function safeGet(key) {
          try { return window.localStorage.getItem(key); } catch (e) { return null; }
        }

        function parseTheme(raw) {
          if (!raw) return null;
          var str = String(raw).trim();
          try {
            var parsed = JSON.parse(str);
            if (typeof parsed === 'string') str = parsed;
            else if (parsed && parsed.state && parsed.state.theme) str = parsed.state.theme;
            else if (parsed && parsed.theme) str = parsed.theme;
          } catch (e) {}
          str = String(str).trim().toLowerCase();
          return ALLOWED[str] ? str : null;
        }

        function resolveTheme(theme) {
          if (theme === 'system') {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          }
          return theme === 'dark' ? 'dark' : 'light';
        }

        // Priority:
        // 1. window.__SNABBB_THEME__ — injected by Cloudflare Pages Worker from Odoo.
        // 2. snabbb-theme cookie — shared across *.snabbb.com.
        // 3. localStorage['snabbb-theme'] — read-only Snabbb/Zustand fallback.
        // 4. localStorage['theme'] — todo mini-app fallback.
        // 5. light fallback.
        var theme = parseTheme(window.__SNABBB_THEME__)
          || parseTheme(readCookie('snabbb-theme'))
          || parseTheme(safeGet('snabbb-theme'))
          || parseTheme(safeGet('theme'))
          || 'light';

        var resolved = resolveTheme(theme);

        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.dataset.themePreference = theme;
        document.documentElement.classList.toggle('dark', resolved === 'dark');
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <title>To-do manager — Task, Event & Calendar Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/Logo/todo_tiffany.png" />
    <style id="ls-css">html{--ls-bg:#F3F6F8;--ls-fg:#172B4D;--ls-ring:rgba(23,43,77,.12);--ls-accent:#2A9D8F;--ls-muted:#64748B}
html[data-theme="dark"]{--ls-bg:#0F1115;--ls-fg:#F1F5F9;--ls-ring:rgba(255,255,255,.18);--ls-accent:#5EEAD4;--ls-muted:#94A3B8}
.ls{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom));text-align:center;background:var(--ls-bg);color:var(--ls-fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:400;font-size:16px;line-height:1.2;letter-spacing:normal;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
.ls,.ls *{box-sizing:border-box;margin:0;padding:0}
.ls{padding:32px;padding-top:max(32px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom))}
.ls-icon{width:min(36vw,160px);height:min(36vw,160px);max-width:none;object-fit:contain;border-radius:22%}
.ls-spinner{width:min(16vw,72px);height:min(16vw,72px);border-radius:50%;border:6px solid var(--ls-ring);border-top-color:var(--ls-accent);animation:ls-spin .8s linear infinite}
.ls-title{margin:0;padding:0;font-family:inherit;font-size:clamp(1.75rem,8vw,2.5rem);font-weight:700;line-height:1.2;letter-spacing:normal;text-transform:none}
.ls-status{margin:0;padding:0;min-height:1.5em;font-family:inherit;font-size:clamp(1rem,4vw,1.125rem);font-weight:400;line-height:1.5;letter-spacing:normal;color:var(--ls-muted)}
@keyframes ls-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ls-spinner{animation-duration:2.4s}}</style>
  </head>
  <body data-accent="blue" class="bg-[var(--bg)] text-[var(--text)] transition-colors duration-200">
    <div id="root"><div class="ls" role="status" aria-live="polite"><img class="ls-icon" src="https://app.snabbb.com/icons/new-icons/to-do.png?v=1" alt="" width="160" height="160"><div class="ls-spinner" aria-hidden="true"></div><h1 class="ls-title">Opening To-Do Manager…</h1><p class="ls-status">Signing you in…</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
